# Render Blueprint — one-click deploy for the Chama System.
# Usage: Render dashboard → New → Blueprint → select this repo → Apply.
# This creates the web service + a free PostgreSQL database and wires DATABASE_URL.
services:
  - type: web
    name: chama-system
    runtime: node
    branch: master
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chama-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: chama-db
    databaseName: chama
    user: chama
